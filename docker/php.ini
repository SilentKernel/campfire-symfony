; Production settings for every PHP process in the image: the FrankenPHP worker threads, and the
; CLI processes bin/start runs beside them (campfire:cable, messenger:consume).

[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 30
; Attachments: Rails has no upload cap of its own; 100 MB matches the Caddyfile request_body limit.
upload_max_filesize = 100M
post_max_size = 105M
max_file_uploads = 50
; Errors go to stderr (docker logs), never into responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED
; Symfony's container and the vendor tree resolve thousands of paths; keep them all cached.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; The app never uses PHP sessions (Rails' cookie store is App\Http\RailsSession).
session.auto_start = Off
zend.assertions = -1
; Rails sends `head` responses as plain "text/html" / "text/vnd.turbo-stream.html". With a
; default_charset, the SAPI appends ";charset=UTF-8" to any text/* Content-Type that has none.
; Symfony sets the charset itself where Rails has one; htmlspecialchars and mbstring default to UTF-8.
default_charset = ""

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
; CLI processes are long-running (cable, messenger) and compile each file once anyway; enabling
; OPcache there would also run the preload script on every bin/console call.
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 32531
; The code is baked into the image and never changes at runtime.
opcache.validate_timestamps = 0
opcache.enable_file_override = 1
; Symfony's preload list, generated by cache:warmup (var/cache/prod/App_KernelProdContainer.preload.php).
opcache.preload = /rails/config/preload.php
; Required when PHP starts as root, ignored otherwise (any --user uid works).
opcache.preload_user = www-data

[apcu]
apc.enabled = 1
; The CLI processes use the same cache.app pool configuration (each has its own APCu segment).
apc.enable_cli = 1
apc.shm_size = 128M

[ffi]
; jcupitt/vips binds libvips.so.42 through FFI at runtime (not only from preload).
ffi.enable = true
