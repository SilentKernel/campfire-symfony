security:
    # Passwords are bcrypt digests compatible with has_secure_password (App\Rails\Password).
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        campfire_users:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Campfire's Authentication concern. Lazy: the authenticators run when
        # App\Http\EventListener\FilterChainListener reaches require_authentication (or
        # restore_authentication), never on their own. It keeps nothing between requests (PHP
        # sessions are off; Rails' cookies are the state), but it is not declared `stateless`,
        # because Symfony never makes a stateless firewall lazy.
        main:
            lazy: true
            provider: campfire_users
            custom_authenticators:
                - App\Security\SessionCookieAuthenticator
                - App\Security\BotKeyAuthenticator

    # Access rules are Rails' controller macros (App\Http\Attribute), not access_control.
    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
